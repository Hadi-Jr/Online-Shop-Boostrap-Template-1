<!-- CHECKOUT START -->
<div class="container">
    <div class="row text-center mt-3">
        <h3 class="fw-bold">Checkout</h3>
    </div>

    <div class="row mt-4" id="checkout">
        <div class="col-12 col-lg-6">
            <h5 class="mt-3 mt-lg-0">Billing Details</h5>
            <hr>
            <form>
                <div class="form-group mt-3">
                    <label for="full_name" class="fw-bold p-1">
                        Full name
                        <span class="required-field">*</span>
                    </label>
                    <input type="text" class="form-control" id="full_name" placeholder="Enter full name">
                </div>

                <div class="form-group mt-2">
                    <label for="email_address" class="fw-bold p-1">
                        Email address
                        <span class="required-field">*</span>
                    </label>
                    <input type="email" class="form-control" id="email_address" placeholder="Enter email address">
                </div>

                <div class="form-group mt-2">
                    <label for="phone_number" class="fw-bold p-1">
                        Phone Number <span class="required-field">*</span>
                    </label>
                    <input type="tel" class="form-control" id="phone_number" placeholder="Enter phone number">
                </div>

                <div class="form-group mt-2">
                    <label for="address" class="fw-bold p-1">
                        Address <span class="required-field">*</span>
                    </label>
                    <input type="text" class="form-control" id="address" placeholder="Enter address">
                </div>

                <div class="row mt-2">
                    <div class="col-6">
                        <label for="myCountry" class="fw-bold p-1">
                            Country
                            <span class="required-field">*</span>
                        </label>

                        <select id="myCountry" style="min-width: 0; width: 100%;">
                            <option value="">Select a country</option>
                            <option value="US">United States</option>
                            <option value="CA">Canada</option>
                        </select>
                    </div>

                    <div class="col-6">
                        <label for="state" class="fw-bold p-1">
                            State <span class="required-field">*</span>
                        </label>
                        <input type="text" class="form-control" id="state" placeholder="Enter state">
                    </div>
                </div>

                <div class="row mt-2">
                    <div class="col-6">
                        <label for="zip_code" class="fw-bold p-1">
                            ZIP Code <span class="required-field">*</span>
                        </label>
                        <input type="text" class="form-control" id="zip_code" placeholder="Enter ZIP code">
                    </div>

                    <div class="col-6">
                        <label for="city" class="fw-bold p-1">
                            City <span class="required-field">*</span>
                        </label>
                        <input type="text" class="form-control" id="city" placeholder="Enter city">
                    </div>
                </div>

                <div class="row mt-2">
                    <div class="col-12">
                        <label for="notes" class="fw-bold p-1">Order Notes (Optional)</label>
                        <textarea class="form-control" id="notes" rows="3"></textarea>
                    </div>
                </div>
            </form>

            <p class="mt-3">Returning customer? <a href="#">Click here to login</a></p>
        </div>

        <!-- Spacer -->
        <div class="col-lg-1 d-none d-lg-block"></div>

        <div class="col-12 col-lg-5 mt-5 mt-lg-0">

            <!-- Review Cart -->
            <h5>Review Your Cart</h5>
            <hr>

            <div class="rounded bg-light p-4">

                <div class="d-flex align-items-center gap-3 p-3">
                    <img src="/assets/images/products/product3.jpg" class="border rounded"
                        style="width:80px;height:80px;object-fit:cover;" alt="Product">

                    <div>
                        <p class="mb-1 fw-semibold">Probiotic multiaction x30 capsules</p>
                        <p class="mb-2 text-muted checkout-product-qty">x1</p>
                        <p class="mb-0 fw-bold">€7.28</p>
                    </div>
                </div>

                <div class="d-flex align-items-center gap-3 p-3">
                    <img src="/assets/images/products/product3.jpg" class="border rounded"
                        style="width:80px;height:80px;object-fit:cover;" alt="Product">

                    <div>
                        <p class="mb-1 fw-semibold">Probiotic multiaction x30 capsules</p>
                        <p class="mb-2 text-muted checkout-product-qty">x1</p>
                        <p class="mb-0 fw-bold">€7.28</p>
                    </div>
                </div>

                <hr>

                <div class="row">
                    <div class="col-9">
                        <p class="fw-semibold mb-2">Subtotal</p>
                    </div>
                    <div class="col-3 text-end">
                        <p class="fw-semibold mb-2">15.74€</p>
                    </div>

                    <div class="col-9">
                        <p class="mb-2">Delivery</p>
                    </div>
                    <div class="col-3 text-end">
                        <p class="mb-2">3.99€</p>
                    </div>

                    <div class="col-9">
                        <p class="mb-2">You saved</p>
                    </div>
                    <div class="col-3 text-end">
                        <p class="mb-2">6.99€</p>
                    </div>

                    <div class="col-9">
                        <p class="mb-0">Tax</p>
                    </div>
                    <div class="col-3 text-end">
                        <p class="mb-0">Included</p>
                    </div>
                </div>

            </div>

            <!-- Payment -->
            <div class="mt-5">

                <h5>Payment</h5>
                <hr>

                <div class="rounded bg-light p-4">
                    <div class="row">
                        <div class="col-12 col-md-6 text-center mb-3 mb-md-0">
                            <div class="fw-bold fs-5">
                                <i class="fa-solid fa-shield-halved me-2"></i>
                                Secured Payment
                            </div>
                        </div>

                        <div class="col-12 col-md-6 text-center mb-4">
                            <div class="fs-4">
                                <i class="fa-brands fa-cc-visa"></i>
                                <i class="fa-brands fa-cc-paypal"></i>
                                <i class="fa-brands fa-cc-amex"></i>
                                <i class="fa-brands fa-cc-apple-pay"></i>
                                <i class="fa-brands fa-cc-mastercard"></i>
                                <i class="fa-brands fa-cc-stripe"></i>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="paymentMethod" id="paymentCreditCard"
                                    checked>
                                <label class="form-check-label" for="paymentCreditCard">
                                    Credit Card / Debit Card
                                </label>
                            </div>

                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="paymentMethod" id="paymentPayPal">
                                <label class="form-check-label" for="paymentPayPal">
                                    PayPal
                                </label>
                            </div>

                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="paymentMethod"
                                    id="paymentBankTransfer">
                                <label class="form-check-label" for="paymentBankTransfer">
                                    Bank Transfer
                                </label>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="radio" name="paymentMethod"
                                    id="paymentCashOnDelivery">
                                <label class="form-check-label" for="paymentCashOnDelivery">
                                    Cash on Delivery
                                </label>
                            </div>

                            <button class="btn w-100 fw-bold text-white green-btn">
                                Place Order
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- CHECKOUT END -->
