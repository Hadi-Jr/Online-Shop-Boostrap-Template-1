<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hadi Jr - Templates</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link rel="stylesheet" href="css/my.css">

  <!-- Select2 -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/css/select2.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css"
    rel="stylesheet" />
  <!-- With this -->
  <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-bs5.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- MAIN START -->
  <main class="container mb-5 my-md-4">

    <!-- ADD PRODUCT START -->

    <div class="row justify-content-center mt-5 mb-5">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="card p-4 shadow border-0">

          <!-- Header -->
          <div class="row mb-3">
            <div class="col-12 text-center">
              <h3 class="fw-bold">
                Add New Product
              </h3>
            </div>
          </div>

          <form id="add-product-form" enctype="multipart/form-data">

            <div class="mb-3">
              <label for="image" class="form-label fw-bold">Images</label>
              <input type="file" class="form-control" id="image" multiple accept="image/*" required>
            </div>

            <div class="row">
              <div class="col-12 col-md-6 mb-3">
                <label for="product_name" class="form-label fw-bold">Product Name</label>
                <input type="text" class="form-control" id="product_name" placeholder="Enter a product name" required>
              </div>

              <div class="col-12 col-md-6 mb-3">
                <label for="sku" class="form-label fw-bold">Product Code</label>
                <input type="text" class="form-control" id="sku" placeholder="Enter a product code" required>
              </div>
            </div>

            <div class="row">
              <div class="col-12 col-md-6 mb-3">
                <label for="barcode" class="form-label fw-bold">Barcode</label>
                <input type="text" class="form-control" id="barcode" placeholder="Enter a barcode">
              </div>

              <div class="col-12 col-md-6 mb-3">
                <label for="brand" class="form-label fw-bold">Brand</label>
                <input type="text" class="form-control" id="brand" placeholder="Enter a brand">
              </div>
            </div>

            <div class="row">
              <div class="col-12 col-md-6 mb-3">
                <label for="price" class="form-label fw-bold">Price</label>
                <input type="number" class="form-control" id="price" placeholder="0.00" min="0" step="0.01" required>
              </div>

              <div class="col-12 col-md-6 mb-3">
                <label for="promo" class="form-label fw-bold">Promo Price</label>
                <input type="number" class="form-control" id="promo" placeholder="0.00" min="0" step="0.01">
              </div>
            </div>

            <div class="mb-3">
              <label for="slug" class="form-label fw-bold">Slug</label>
              <input type="text" class="form-control" id="slug" disabled>
              <small class="text-muted">Auto-generated from product name</small>
            </div>

            <div class="row align-items-center">
              <div class="col-12 col-md-8 mb-3">
                <label for="quantity" class="form-label fw-bold">Quantity</label>
                <input type="number" class="form-control" id="quantity" placeholder="Enter a quantity" min="0" required>
              </div>

              <div class="col-12 col-md-3 mb-3 ms-md-auto">
                <label class="form-label fw-bold d-block">Status</label>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="statusSwitch" checked>
                  <label class="form-check-label status-label" for="statusSwitch">Available</label>
                </div>
              </div>
            </div>

            <div class="mb-3">
              <fieldset class="border rounded-3 p-3">
                <legend class="float-none w-auto px-2 fs-6 fw-bold">Product Specifications</legend>

                <div id="featureContainer">
                  <div class="feature-row d-flex gap-2 mb-2">
                    <input type="text" class="form-control" placeholder="Key (e.g., Color)" name="feature_key[]">
                    <input type="text" class="form-control" placeholder="Value (e.g., Red)" name="feature_value[]">
                    <button class="btn btn-danger remove-feature" disabled>×</button>
                  </div>
                </div>

                <button type="button" class="btn green-btn btn-sm mt-2" id="addFeature">
                  Add Feature
                </button>
              </fieldset>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label fw-bold">Description</label>
              <textarea class="form-control" id="description" rows="4"
                placeholder="Enter product description"></textarea>
            </div>

            <div class="row mt-2">
              <div class="col-12">
                <button type="submit" class="btn w-100 fw-bold gray-btn">
                  Add Product
                </button>
              </div>
            </div>

          </form>
        </div>
      </div>
    </div>

    <!--  ADD PRODUCT END -->

  </main>
  <!-- MAIN END -->

  <!-- SCRIPTS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/rater-js@1.0.1/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="/assets/js/swiper.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/js/select2.min.js"></script>
  <script src="/assets/js/select2.js"></script>
  <script src="/assets/js/rating.init.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/assets/js/sweet-alert.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-bs5.min.js"></script>
  <script src="/assets/js/summernote.js"></script>
  <script src="/assets/js/my.js"></script>
</body>

</html>
