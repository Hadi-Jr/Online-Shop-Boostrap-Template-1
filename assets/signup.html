<!-- SIGN UP START -->

<div class="row justify-content-center mt-5 mb-5">
    <div class="col-12 col-md-8 col-lg-5">

        <div class="card p-4 shadow border-0">
            <div class="row mb-3">
                <div class="col-12 text-center">
                    <h3 class="fw-bold">Sign Up</h3>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <form>
                        <div class="mb-3">
                            <label for="full_name" class="form-label fw-bold">Full Name</label>
                            <input type="text" class="form-control" id="full_name" placeholder="Enter your full name"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold">Username</label>
                            <input type="text" class="form-control" id="username" placeholder="Choose a username"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Create a password"
                                required>
                        </div>


                        <div class="mb-3">
                            <label for="confirm_password" class="form-label fw-bold">Confirm Password</label>
                            <input type="password" class="form-control" id="confirm_password"
                                placeholder="Confirm your password" required>
                        </div>
                    </form>
                </div>
            </div>

            <div class="row align-items-center gap-2">
                <div class="col-12">
                    <div>
                        <span class="p-1 small">
                            <a class="pointer">Already have an account ?</a>
                        </span>
                    </div>
                </div>
                <div class="col-12">
                    <button class="btn w-100 fw-bold gray-btn">
                        Sign Up
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- SIGN UP END -->
