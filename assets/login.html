<!-- LOGIN START -->

<div class="row justify-content-center mt-5 mb-5">
    <div class="col-12 col-md-8 col-lg-5">

        <div class="p-4 card shadow border-0">

            <div class="row mb-3">
                <div class="col-12 text-center">
                    <h3 class="fw-bold">Sign Up</h3>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <form>
                        <div class="mb-3">
                            <label for="full_name" class="fw-bold p-1">Username or Email</label>
                            <input type="email" class="form-control" id="full_name"
                                placeholder="Enter username or email">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="fw-bold p-1">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Enter password">
                        </div>
                    </form>
                </div>
            </div>

            <div class="row align-items-center mb-3">
                <span>
                    <a class="pointer small">Forgotten password ?</a>
                </span>
            </div>

            <div class="row gap-2 gap-md-0">
                <div class="col-12 col-md-6">
                    <button class="btn w-100 fw-bold green-btn">
                        Login
                    </button>
                </div>
                <div class="col-12 col-md-6">
                    <button class="btn w-100 fw-bold btn-secondary">
                        Create New Account
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- LOGIN END -->
